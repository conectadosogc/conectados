services:
  postgres:
    image: postgres:16-alpine
    container_name: conectados-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: conectados
      POSTGRES_USER: conectados
      POSTGRES_PASSWORD: conectados_dev
    ports:
      - "5432:5432"
    volumes:
      - conectados_postgres_data:/var/lib/postgresql/data

volumes:
  conectados_postgres_data:
